apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-static-new
  namespace: tandoor
spec:
  accessModes: ["ReadWriteOnce"]
  # Pinned to the live CSI PV (volumeName is set once the claim pre-binds;
  # required to match the live object so ArgoCD stays in sync).
  volumeName: pvc-3eee4126-be19-40bd-80de-df1f6f3b1a3f
  resources:
    requests:
      storage: 2Gi
  storageClassName: truenas-iscsi
