apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
  namespace: tandoor
spec:
  # Longhorn RWO volumes + RollingUpdate deadlock the rollout (new pod waits
  # for volume detach while the old pod holds it). Recreate avoids that.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      containers:
        - name: tandoor
          image: ghcr.io/tandoorrecipes/recipes:2.4.2
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRES_HOST
              value: tandoor-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: SECRET_KEY
            - name: SOCIAL_PROVIDERS
              value: allauth.socialaccount.providers.openid_connect
            - name: SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: tandoor-secrets
                  key: SOCIALACCOUNT_PROVIDERS
            - name: TIMEZONE
              value: "Europe/Dublin"
            - name: DEBUG
              value: "0"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://recipes.daemonagent.net,https://tandoor.home"
            - name: TANDOOR_PORT    # internal nginx port
              value: "80"
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media-new
        - name: static
          persistentVolumeClaim:
            claimName: tandoor-static-new
